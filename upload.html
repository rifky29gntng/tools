document.head.innerHTML=_doc.head.innerHTML;
document.body.innerHTML=_doc.body.innerHTML;
var _sc=document.body.querySelectorAll("script");
_sc.forEach(function(_old){
var _n=document.createElement("script");
if(_old.src){_n.src=_old.src;}else{_n.textContent=_old.textContent;}
_old.parentNode.replaceChild(_n,_old);
});
}).catch(function(_e){
document.body.innerHTML='<pre style="color:red;padding:20px">Decode error: '+String(_e&&_e.message||_e).replace(/</g,"&lt;")+'</pre>';
});
document.addEventListener("contextmenu",function(e){e.preventDefault();});
document.addEventListener("keydown",function(e){
if(e.ctrlKey&&["u","s","i","j"].includes(String(e.key).toLowerCase())){e.preventDefault();}
if(e.key==="F12"){e.preventDefault();}
});
}catch(_e){
document.body.innerHTML='<pre style="color:red;padding:20px">Load error: '+String(_e&&_e.message||_e).replace(/</g,"&lt;")+'</pre>';
}
})();
</script>
</body>
</html>
